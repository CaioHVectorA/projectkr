name: Build & Release Windows Standalone

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex: v0.3.1)"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run test suite
        run: bun test

      - name: Build Windows x64 standalone executable
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exePath = "dist/ProjetoLoot-$tag-win-x64.exe"
          bun build backend/http/server.ts --compile --target=bun-windows-x64 --outfile $exePath
          Write-Output "TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "EXE_PATH=$exePath" >> $env:GITHUB_ENV
          Write-Output "EXE_NAME=ProjetoLoot-$tag-win-x64.exe" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = @"
          ## PROJETO LOOT $env:TAG — Executável Único Windows (.exe)

          **Sem `.bat`, sem `.zip`, sem `.env`, sem instalar Bun/Node.**
          Basta baixar o executável único e dar dois cliques.

          ### Como usar
          1. Baixe **``$env:EXE_NAME``** abaixo.
          2. Dê dois cliques no arquivo — o servidor sobe em ``127.0.0.1:3000`` (loopback local, evitando alertas de firewall de rede) e abre automaticamente o navegador em ``http://localhost:3000``.
          3. Clique em **Configurações** no topo da tela para colar sua Riot API Key e seu Riot ID padrão (ou teste imediatamente usando **Modo Demo (Mock)** e **Simular Evento Live**).

          ### Novidades desta versão
          - **Executável único ``.exe``:** substituído o ``.bat`` por abertura automática do navegador direto pelo executável (via Shell API nativa do Windows, sem ``cmd.exe``).
          - **Bind estrito em ``127.0.0.1``:** não expõe porta para a rede externa e evita bloqueios do Windows Defender Firewall.
          - **Configurações 100% In-App:** salvas localmente em ``data/settings.json`` ao lado do ``.exe``.
          - **Lente 1 (Autópsia Pós-Jogo)** + **Lente 2 (Live Coach Read-Only)**.
          "@
          gh release create "$env:TAG" "$env:EXE_PATH" `
            --title "PROJETO LOOT $env:TAG — Executável Único Windows (.exe)" `
            --notes $notes
