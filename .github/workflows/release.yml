name: Build & Release Windows Standalone

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex: v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run test suite
        run: bun test

      - name: Build Windows x64 standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          bun run build:win

      - name: Package Windows release zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $pkgDir = "dist/projeto-loot-$tag-win-x64"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

          Copy-Item "dist/projeto-loot-win-x64.exe" "$pkgDir/projeto-loot-win-x64.exe"
          Copy-Item "README.md" "$pkgDir/README.md"

          $bat = @"
          @echo off
          title PROJETO LOOT - Coach Tatico Local (BR1)
          echo Iniciando PROJETO LOOT em http://localhost:3000 ...
          start "" cmd /c "timeout /t 2 /nobreak >nul && start http://localhost:3000"
          "%~dp0projeto-loot-win-x64.exe"
          pause
          "@
          Set-Content -Path "$pkgDir/INICIAR_PROJETO_LOOT.bat" -Value $bat -Encoding ASCII

          $zipPath = "dist/projeto-loot-$tag-win-x64.zip"
          Compress-Archive -Path $pkgDir -DestinationPath $zipPath -Force
          Write-Output "TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = @"
          ## PROJETO LOOT $env:TAG (Windows x64 Standalone — Zero .env)

          Versão 100% amigável para Windows 10/11 — **sem precisar instalar Bun/Node e sem editar arquivos .env**. Tudo é configurado direto na interface do app.

          ### Como usar em 2 passos (Windows 10/11)
          1. Baixe e extraia ``projeto-loot-$env:TAG-win-x64.zip``.
          2. Dê dois cliques em **``INICIAR_PROJETO_LOOT.bat``** — o app abre automaticamente em ``http://localhost:3000``.
          3. *(Opcional)* Clique em **Configurações** no topo da tela para colar sua Riot API Key, definir seu Riot ID padrão, testar a chave em 1 clique ou ajustar o CLI ``agy``. Sem chave, o **Modo Demo (Mock)** e **Simular Evento Live** já funcionam na hora.

          ### O que está incluído
          - **Configurações 100% In-App:** Riot API Key (com botão Testar Chave e mascaramento), Riot ID padrão, Servidor, CLI ``agy`` (caminho, modo ``arg|stdin``, timeout) e intervalos do Live Coach salvos automaticamente em ``data/settings.json``.
          - **Arquitetura em Camadas:** Camada de Dados (``backend/data/``), Camada de Domínio (``backend/domain/``), Camada de IA (``backend/ai/``) e Camada HTTP (``backend/http/``).
          - **Lente 1 — Autópsia Pós-Jogo:** busca por Riot ID, histórico das últimas 10 partidas com filtro de fila, Data Dragon ``pt_BR``, condensador da Timeline (``< 6KB``) e 4 blocos analíticos.
          - **Lente 2 — Live Coach (Read-Only):** polling a cada ``12s`` em ``127.0.0.1:2999``, loop silencioso por deltas (cooldown ``60s``), avisos de **máximo 2 linhas**, botão **MUTE**, histórico e **Simular Evento Live**.
          "@
          gh release create "$env:TAG" "$env:ZIP_PATH" `
            --title "PROJETO LOOT $env:TAG — Configurações In-App + Lente 1 + Live Coach" `
            --notes $notes
